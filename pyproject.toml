[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epa-research"
version = "0.3.0"
description = "EduPredict experimental scientific tooling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
research = ["duckdb>=1.2,<2", "numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["epa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
