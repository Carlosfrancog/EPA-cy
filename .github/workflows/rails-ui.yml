name: Rails navigable UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: bundle install
      - run: bundle exec rails test test/controllers/navigation_test.rb
      - run: bundle exec rails routes
