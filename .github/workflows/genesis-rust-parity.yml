name: GENESIS Rust parity

on:
  pull_request:
    paths:
      - 'engines/genesis-rs/**'
      - 'tools/check_genesis_rust_stream.py'
      - 'tools/benchmark_genesis.py'
      - 'tests/test_benchmark_genesis.py'
      - 'pyproject.toml'
      - 'tools/compare_genesis_parquet.py'
      - 'epa/genesis/rust_bridge.py'
      - 'tools/compare_genesis_parquet.py'
      - '.github/workflows/genesis-rust-parity.yml'
  push:
    branches: [develop]
    paths:
      - 'engines/genesis-rs/**'
      - 'tools/check_genesis_rust_stream.py'
      - '.github/workflows/genesis-rust-parity.yml'

jobs:
  rust-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust compiler
        run: rustc --version
      - name: Run golden-vector tests
        run: cargo test --locked --manifest-path engines/genesis-rs/Cargo.toml
      - name: Inspect synthetic ATLAS demo
        run: cargo run --locked --release --manifest-path engines/genesis-rs/Cargo.toml -- inspect examples/atlas.demo.json 120 20261029
      - name: Verify SHA256 seed
        shell: bash
        run: |
          actual=$(cargo run --locked --quiet --release --manifest-path engines/genesis-rs/Cargo.toml -- seed 20261029 SYN00000001 profile)
          test "$actual" = "3051383292237719500"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Rust academic records against Python v3
        env:
          PYTHONPATH: .
        run: python tools/check_genesis_rust_stream.py --students 3 --seed 20261029
      - name: Install Parquet and benchmark tools
        run: python -m pip install -e ".[dev,research,streaming,benchmark]"
      - name: Create Python GENESIS v3 small reference
        run: python -m epa.genesis.v3 --output data/ci-genesis-py3 --students 3 --seed 20261029
      - name: Persist Rust records as Parquet via bridge
        run: python -m epa.genesis.rust_bridge --output data/ci-genesis-rustbridge --students 3 --seed 20261029
      - name: Verify hashes and compare all logical Parquet tables
        run: python tools/compare_genesis_parquet.py data/ci-genesis-py3 data/ci-genesis-rustbridge
      - name: Generate native Rust Parquet
        run: cargo run --locked --release --manifest-path engines/genesis-rs/Cargo.toml -- generate-parquet examples/atlas.demo.json data/ci-genesis-rust-native 3 20261029 64
      - name: Validate native Rust Parquet against Python v3
        run: python tools/compare_genesis_parquet.py data/ci-genesis-py3 data/ci-genesis-rust-native
      - name: Check immutable native output
        shell: bash
        run: |
          if cargo run --locked --release --manifest-path engines/genesis-rs/Cargo.toml -- generate-parquet examples/atlas.demo.json data/ci-genesis-rust-native 3 20261029 64; then
            echo "ERROR: immutable output was overwritten"
            exit 1
          fi
      - name: Verify benchmark statistics
        run: python -m pytest -q tests/test_benchmark_genesis.py
      - name: Verify small benchmark end to end
        run: python tools/benchmark_genesis.py --students 1 --warmups 0 --repeats 1 --engines python_v3_pyarrow rust_native_parquet --sample-ms 5 --output-root data/ci-genesis-bench
